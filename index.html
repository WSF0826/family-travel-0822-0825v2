      {
        id: "spot_d4_3",
        name: "中央公園遊客中心航廈 (D4 Plan C)",

        lng: 120.6558,
        time: "1.5 小時",
        transport: "中清交流道下 8 分鐘，地下停車場大",

        desc: "【Plan C 水湳線】機場航廈與太空艙造型！免費實體客機座艙與 VR 飛航體驗，拍 15 人家族大合照極具質感。午餐可至水湳大一點或七期鼎泰豐/享鴨。",
        backupId: "spot_d4_1",
        backupName: "麗寶 OUTLET PARK",
        backupReason: "結束航廈體驗後，可直奔后里麗寶 Outlet 享用美食街。"

    // State Management
    let currentCategory = 'all';
    let currentSpot = null;
    let savedSpotIds = JSON.parse(localStorage.getItem('chiayi_family_saved_spots') || '[]');
    let map = null;
    let markersMap = {};

    window.onload = function() {
      initMap();
      renderSidebarSpots();
      updateSavedCount();
      setupEventListeners();
    };

    function initMap() {
      // Centered between Taichung & Chiayi
      map = L.map('map', {
        zoomControl: false
      }).setView([23.9500, 120.5500], 9.5);

      // Voyager Tile Layer
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        maxZoom: 18
      }).addTo(map);

      // Custom Leaflet Markers
      MOCK_SPOTS.forEach(spot => {
        const isBackup = spot.category === '備案專區';
        const markerIcon = L.divIcon({
          className: 'custom-map-pin',
          html: `
            <div class="spot-pin transition-transform duration-200 hover:scale-125 cursor-pointer" data-id="${spot.id}">
              <div class="w-8 h-8 rounded-full ${isBackup ? 'bg-purple-600' : 'bg-amber-500'} text-slate-950 flex items-center justify-center shadow-lg border-2 border-white text-xs font-bold">
                <i class="${isBackup ? 'fa-solid fa-umbrella' : 'fa-solid fa-location-dot'}"></i>
              </div>
            </div>
          `,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        const marker = L.marker([spot.lat, spot.lng], { icon: markerIcon }).addTo(map);
        
        marker.on('click', () => {
          openSpotDrawer(spot);
        });

        markersMap[spot.id] = marker;
      });
    }

    function renderSidebarSpots() {
      const container = document.getElementById('sidebarSpotList');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = MOCK_SPOTS.filter(s => {
        const matchesCat = currentCategory === 'all' || s.category === currentCategory;
        const matchesSearch = s.name.toLowerCase().includes(searchVal) || s.desc.toLowerCase().includes(searchVal) || s.locationShort.toLowerCase().includes(searchVal);
        return matchesCat && matchesSearch;
      });

      container.innerHTML = filtered.map(spot => {
        const isSaved = savedSpotIds.includes(spot.id);
        return `
          <div onclick="selectSpotById('${spot.id}')" class="p-3 bg-slate-950/60 hover:bg-slate-800/80 border border-slate-800/80 rounded-xl cursor-pointer transition flex space-x-3 items-center group">
            <img src="${spot.image}" class="w-14 h-14 rounded-lg object-cover bg-slate-800 shrink-0">
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-1">
                <h4 class="font-bold text-xs text-slate-100 truncate group-hover:text-amber-400 transition">${spot.name}</h4>
                ${isSaved ? '<i class="fa-solid fa-star text-amber-400 text-xs"></i>' : ''}
              </div>
              <div class="text-[10px] text-slate-400 flex items-center space-x-2">
                <span><i class="fa-regular fa-clock mr-1"></i>${spot.time}</span>
                <span class="px-1.5 py-0.2 rounded bg-slate-800 text-slate-300 border border-slate-700">${spot.category}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectSpotById(id) {
      const spot = MOCK_SPOTS.find(s => s.id === id);
      if (spot) {
        openSpotDrawer(spot);
      }
    }

    function openSpotDrawer(spot) {
      currentSpot = spot;

      // Pan map smoothly
      map.flyTo([spot.lat, spot.lng], 13.5, { duration: 1.2 });

      // Update Drawer DOM
      document.getElementById('drawerSpotName').textContent = spot.name;
      document.getElementById('drawerCatTag').textContent = spot.category;
      document.getElementById('drawerTimeTag').innerHTML = `<i class="fa-regular fa-clock mr-1"></i>${spot.time}`;
      document.getElementById('drawerSpotImg').src = spot.image;
      document.getElementById('drawerLocationShort').textContent = spot.locationShort;
      document.getElementById('drawerTransport').textContent = spot.transport;
      document.getElementById('drawerWeatherSuit').textContent = spot.weatherSuit;
      document.getElementById('drawerDesc').textContent = spot.desc;

      // Backup Section
      document.getElementById('drawerBackupName').textContent = spot.backupName;
      document.getElementById('drawerBackupReason').textContent = spot.backupReason;

      // Update Save Button State
      updateSaveButtonUI();

      // External Map Link
      document.getElementById('btnExternalMap').href = `https://www.google.com/maps/search/?api=1&query=${spot.lat},${spot.lng}`;

      // Show Drawer
      const drawer = document.getElementById('spotDrawer');
      const overlay = document.getElementById('drawerOverlay');
      
      overlay.classList.remove('hidden');
      setTimeout(() => overlay.classList.add('opacity-100'), 10);
      
      drawer.classList.remove('translate-y-full', 'md:translate-x-full');
    }

    function closeSpotDrawer() {
      const drawer = document.getElementById('spotDrawer');
      const overlay = document.getElementById('drawerOverlay');

      drawer.classList.add('translate-y-full', 'md:translate-x-full');
      overlay.classList.remove('opacity-100');
      setTimeout(() => overlay.classList.add('hidden'), 300);
      currentSpot = null;
    }

    function switchToBackupSpot() {
      if (!currentSpot) return;
      
      const backupSpot = MOCK_SPOTS.find(s => s.id === currentSpot.backupId);
      if (backupSpot) {
        showToast(`已為您切換至備案：${backupSpot.name}`, 'fa-solid fa-right-left text-sky-400');
        openSpotDrawer(backupSpot);
      } else {
        showToast('暫無對應的備案資料', 'fa-solid fa-circle-exclamation text-amber-400');
      }
    }

    function toggleSaveCurrentSpot() {
      if (!currentSpot) return;

      const idx = savedSpotIds.indexOf(currentSpot.id);
      if (idx > -1) {
        savedSpotIds.splice(idx, 1);
        showToast(`已從定案清單移除：${currentSpot.name}`, 'fa-solid fa-trash text-rose-400');
      } else {
        savedSpotIds.push(currentSpot.id);
        showToast(`已納入家族定案：${currentSpot.name}`, 'fa-solid fa-star text-amber-400');
      }

      localStorage.setItem('chiayi_family_saved_spots', JSON.stringify(savedSpotIds));
      updateSaveButtonUI();
      updateSavedCount();
      renderSidebarSpots();
    }

    function updateSaveButtonUI() {
      if (!currentSpot) return;
      const isSaved = savedSpotIds.includes(currentSpot.id);
      const btn = document.getElementById('btnSaveSpot');
      const text = document.getElementById('btnSaveSpotText');

      if (isSaved) {
        btn.className = "flex-1 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center space-x-1.5 border border-amber-500/30";
        text.textContent = "已納入家族清單 (點擊移除)";
      } else {
        btn.className = "flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center space-x-1.5 shadow-lg shadow-amber-500/10";
        text.textContent = "納入家族定案清單";
      }
    }

    function updateSavedCount() {
      document.getElementById('savedCountBadge').textContent = savedSpotIds.length;
    }

    function openItineraryModal() {
      const container = document.getElementById('itineraryList');
      const savedSpots = MOCK_SPOTS.filter(s => savedSpotIds.includes(s.id));

      document.getElementById('modalTotalCount').textContent = savedSpots.length;

      if (savedSpots.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 text-slate-500 text-xs">
            <i class="fa-regular fa-folder-open text-3xl mb-2 text-slate-600 block"></i>
            目前尚未納入任何定案地點，請點擊地圖景點進行選擇。
          </div>
        `;
      } else {
        container.innerHTML = savedSpots.map((spot, index) => `
          <div class="p-3 bg-slate-950/80 border border-slate-800 rounded-xl flex items-center justify-between">
            <div class="flex items-center space-x-3 min-w-0">
              <span class="w-5 h-5 rounded-full bg-slate-800 text-amber-400 font-bold text-[10px] flex items-center justify-center shrink-0">${index + 1}</span>
              <div class="min-w-0">
                <h4 class="font-bold text-xs text-white truncate">${spot.name}</h4>
                <div class="text-[10px] text-slate-400"><i class="fa-regular fa-clock mr-1"></i>${spot.time} ｜ ${spot.locationShort}</div>
              </div>
            </div>
            <button onclick="removeSavedSpot('${spot.id}')" class="text-slate-500 hover:text-rose-400 p-1.5 transition">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `).join('');
      }

      document.getElementById('itineraryModal').classList.remove('hidden');
    }

    function removeSavedSpot(id) {
      savedSpotIds = savedSpotIds.filter(sid => sid !== id);
      localStorage.setItem('chiayi_family_saved_spots', JSON.stringify(savedSpotIds));
      updateSavedCount();
      renderSidebarSpots();
      openItineraryModal();
      showToast('已移除地點', 'fa-solid fa-trash text-slate-400');
    }

    function exportItinerarySummary() {
      const savedSpots = MOCK_SPOTS.filter(s => savedSpotIds.includes(s.id));
      if (savedSpots.length === 0) {
        showToast('選集為空，無法複製', 'fa-solid fa-circle-exclamation text-amber-400');
        return;
      }

      let summaryText = `👨‍👩‍👧‍👦 【嘉義家族 4 天 3 夜深度遊定案簡報】 (15人 4車)\n\n`;
      savedSpots.forEach((s, i) => {
        summaryText += `${i + 1}. ${s.name} (${s.time})\n`;
        summaryText += `   📍 位置：${s.locationShort}\n`;
        summaryText += `   🚗 交通：${s.transport}\n`;
        summaryText += `   💡 備案/替代：${s.backupName}\n\n`;
      });

      const textArea = document.createElement("textarea");
      textArea.value = summaryText;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);

      showToast('已複製家族行程簡報，可直接貼到 LINE 群組！', 'fa-solid fa-copy text-emerald-400');
    }

    function setupEventListeners() {
      // Close Drawer
      document.getElementById('btnCloseDrawer').addEventListener('click', closeSpotDrawer);
      document.getElementById('drawerOverlay').addEventListener('click', closeSpotDrawer);

      // Switch Backup
      document.getElementById('btnSwitchToBackup').addEventListener('click', switchToBackupSpot);

      // Save Spot
      document.getElementById('btnSaveSpot').addEventListener('click', toggleSaveCurrentSpot);

      // Search & Category Filter
      document.getElementById('searchInput').addEventListener('input', renderSidebarSpots);
      
      document.querySelectorAll('.cat-btn, .m-cat-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const cat = e.currentTarget.dataset.cat;
          currentCategory = cat;

          document.querySelectorAll('.cat-btn, .m-cat-btn').forEach(b => {
            b.classList.remove('active', 'bg-sky-600', 'text-white');
            b.classList.add('bg-slate-800', 'text-slate-400');
          });

          e.currentTarget.classList.add('active', 'bg-sky-600', 'text-white');
          renderSidebarSpots();
        });
      });

      // Itinerary Modal Actions
      document.getElementById('btnOpenItinerary').addEventListener('click', openItineraryModal);
      document.getElementById('btnCloseItinerary').addEventListener('click', () => {
        document.getElementById('itineraryModal').classList.add('hidden');
      });
      document.getElementById('btnClearItinerary').addEventListener('click', () => {
        savedSpotIds = [];
        localStorage.removeItem('chiayi_family_saved_spots');
        updateSavedCount();
        renderSidebarSpots();
        openItineraryModal();
        showToast('已清空選集', 'fa-solid fa-broom text-slate-400');
      });
      document.getElementById('btnExportItinerary').addEventListener('click', exportItinerarySummary);

      // Reset Map Zoom to All
      document.getElementById('btnResetMap').addEventListener('click', () => {
        map.flyTo([23.9500, 120.5500], 9.5);
      });
    }

    function showToast(msg, iconClass) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.textContent = msg;
      toastIcon.className = iconClass || 'fa-solid fa-circle-check text-emerald-400';

      toast.classList.remove('-translate-y-10', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-10', 'opacity-0');
      }, 2500);
    }
  </script>
